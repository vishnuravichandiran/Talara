<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#291809"/>
      <stop offset="100%" stop-color="#140b03"/>
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Atmospheric Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Radial Halo Accent -->
  <circle cx="300" cy="270" r="180" fill="url(#glowGrad)" filter="url(#softGlow)"/>

  <!-- Geometric Decorative Frame -->
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#fbbf24" stroke-opacity="0.18" stroke-width="1.5"/>
  <rect x="36" y="36" width="528" height="528" rx="12" fill="none" stroke="#fbbf24" stroke-opacity="0.08" stroke-width="1"/>

  <!-- TALARA Heritage Seal at Top -->
  <g transform="translate(300, 75)" text-anchor="middle">
    <circle cx="0" cy="0" r="20" fill="#000" fill-opacity="0.4" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M0 -12 V12 M-12 0 H12 M-8 -8 L8 8 M-8 8 L8 -8" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>
    <text y="32" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="4">TALARA BOTANICALS</text>
    <text y="44" fill="#a1a1aa" font-family="sans-serif" font-size="8" letter-spacing="2">BORASSUS FLABELLIFER</text>
  </g>

  <!-- Center Product Silhouette & Geometry -->
  <g transform="translate(300, 275)">
    <!-- Base Plate/Shadow -->
    <ellipse cx="0" cy="115" rx="130" ry="24" fill="#000" fill-opacity="0.6"/>

    <!-- Distinct Product Shape Representation -->
    <rect x="-70" y="-85" width="140" height="175" rx="18" fill="#141916" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="-60" y="-75" width="120" height="70" rx="6" fill="#0c100e" stroke="#fbbf24" stroke-opacity="0.2" stroke-width="1"/>
    
    <!-- Packaging Label Art -->
    <rect x="-55" y="10" width="110" height="65" rx="4" fill="#1b231f" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1"/>
    <text x="0" y="30" text-anchor="middle" fill="#fbbf24" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1">100% PURE</text>
    <text x="0" y="45" text-anchor="middle" fill="#f4f4f5" font-family="sans-serif" font-size="11" font-weight="bold">Iconic Heritage Re</text>
    <text x="0" y="60" text-anchor="middle" fill="#71717a" font-family="sans-serif" font-size="8">ORIGIN: TAMIL NADU</text>

    <!-- Top Cap / Seal -->
    <rect x="-35" y="-105" width="70" height="22" rx="5" fill="#fbbf24" fill-opacity="0.8"/>
    <circle cx="0" cy="-94" r="5" fill="#121815"/>
  </g>

  <!-- Bottom Badges & Typographic Title -->
  <g transform="translate(300, 480)" text-anchor="middle">
    <!-- Category & Part -->
    <rect x="-140" y="-22" width="280" height="24" rx="12" fill="#000" fill-opacity="0.5" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1"/>
    <text y="-6" fill="#fbbf24" font-family="monospace" font-size="10" font-weight="bold" letter-spacing="1.5">TRADITIONAL FOODS & SWEETS</text>

    <!-- Product Name -->
    <text y="24" fill="#ffffff" font-family="serif" font-size="20" font-weight="bold">Tirunelveli Style Karupatt...</text>
    <text y="42" fill="#9ca3af" font-family="sans-serif" font-size="11" font-style="italic">Slow-Stirred Fermented Wheat Milk Halwa</text>

    <!-- Price Tag in INR (₹) -->
    <g transform="translate(0, 68)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#fbbf24" fill-opacity="0.15" stroke="#fbbf24" stroke-width="1.2"/>
      <text y="5" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1">₹369</text>
    </g>
  </g>
</svg>